syntax = "proto3";

package inferstream.v1;

// The central Coordinator service that manages distributed inference.
service CoordinatorService {
  // ---------------------------------------------------------
  // Client Endpoints
  // ---------------------------------------------------------
  
  // Submit a new prompt for inference.
  rpc SubmitRequest(SubmitRequestReq) returns (SubmitRequestRes);

  // ---------------------------------------------------------
  // Worker Endpoints
  // ---------------------------------------------------------
  
  // Register a new worker node with the coordinator.
  rpc RegisterWorker(RegisterWorkerReq) returns (RegisterWorkerRes);
  
  // Worker polls for a batch of pending requests.
  rpc GetWork(GetWorkReq) returns (GetWorkRes);
  
  // Worker submits the completed inference results.
  rpc SubmitResults(SubmitResultsReq) returns (SubmitResultsRes);
}

// --- Submit Request ---
message SubmitRequestReq {
  string prompt = 1;
}

message SubmitRequestRes {
  string request_id = 1;
  // Note: For a real system, you might want a way to poll for the result 
  // or use a streaming response. For now, we keep it simple.
}

// --- Register Worker ---
message RegisterWorkerReq {
  // A unique identifier for the worker (e.g. hostname or UUID).
  string worker_id = 1;
}

message RegisterWorkerRes {
  bool success = 1;
}

// --- Get Work ---
message GetWorkReq {
  string worker_id = 1;
  int32 max_batch_size = 2;
}

// A single item of work for the worker to process.
message InferenceTask {
  string request_id = 1;
  string prompt = 2;
}

message GetWorkRes {
  repeated InferenceTask tasks = 1;
}

// --- Submit Results ---
// The result of a single generated task.
message InferenceResult {
  string request_id = 1;
  string generated_text = 2;
  // We can also include metrics like token count or latency here later!
}

message SubmitResultsReq {
  string worker_id = 1;
  repeated InferenceResult results = 2;
}

message SubmitResultsRes {
  bool success = 1;
}
