[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "inferstream"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.2.0",
    "protobuf>=6.0.0",
    "psutil>=7.2.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=4.40.0",
]

[project.scripts]
inferstream = "inferstream.cli:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.60.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inferstream"]
